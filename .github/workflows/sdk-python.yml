name: Python SDK

on:
  push:
    branches: ["main"]
    paths:
      - 'sdk/python/**'
      - '.github/workflows/sdk-python.yml'
  pull_request:
    paths:
      - 'sdk/python/**'
      - '.github/workflows/sdk-python.yml'

jobs:
  # ------------------------------------------------------------------
  # Unit tests — mocked HTTP, no server, runs on every push/PR
  # ------------------------------------------------------------------
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            tox-env: "py39-unit"
          - python-version: "3.10"
            tox-env: "py310-unit"
          - python-version: "3.11"
            tox-env: "py311-unit"
          - python-version: "3.12"
            tox-env: "py312-unit"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: pip install tox

      - name: Run unit tests
        run: tox -e ${{ matrix.tox-env }}
        working-directory: sdk/python

  # ------------------------------------------------------------------
  # Live tests — real figuard server via Testcontainers
  # Only runs on push to main (post-merge), not on every PR.
  # Building the Docker image takes ~3-4 minutes; running this on
  # every PR would slow down review loops significantly.
  # If a live test fails on main, the committer is notified via
  # GitHub Actions email.
  # ------------------------------------------------------------------
  live:
    name: Live tests (Testcontainers)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: figuard
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Java for Docker build
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Docker Buildx (enables layer caching)
        uses: docker/setup-buildx-action@v3

      - name: Build figuard Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: figuard:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tox
        run: pip install tox

      - name: Run live tests
        run: tox -e live
        working-directory: sdk/python
        env:
          FIGUARD_API_KEY: fg_live_demo

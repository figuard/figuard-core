name: Publish npm packages

on:
  push:
    tags:
      - "v*"

jobs:
  # -------------------------------------------------------------------------
  # TypeScript SDK → npm package "figuard"
  # -------------------------------------------------------------------------
  sdk-typescript:
    name: Publish figuard (TypeScript SDK)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Verify version matches tag
        working-directory: sdk/typescript
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "❌ Tag version ($TAG) does not match package version ($PKG)."
            echo "   Bump the version in sdk/typescript/package.json before tagging."
            exit 1
          fi
          echo "✓ Version $PKG matches tag $TAG"

      - name: Install dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Build
        run: npm run build
        working-directory: sdk/typescript

      - name: Publish to npm
        run: npm publish --access public
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -------------------------------------------------------------------------
  # MCP server → npm package "figuard-mcp"
  # MCP uses its own version (currently 0.2.0) independent of the SDK.
  # It publishes on every v* tag — if MCP version wasn't bumped, npm will
  # reject it as a duplicate (non-fatal for SDK publish, which runs in parallel).
  # -------------------------------------------------------------------------
  mcp:
    name: Publish figuard-mcp
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json

      - name: Check whether MCP version is already published
        id: check
        working-directory: packages/mcp
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$PKG" version &>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ figuard-mcp@$PKG is already on npm — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "✓ figuard-mcp@$PKG is new — will publish."
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci
        working-directory: packages/mcp

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npm run build
        working-directory: packages/mcp

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

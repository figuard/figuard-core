name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.1.0). Defaults to package.json version."
        required: false
        default: ""

jobs:
  # -------------------------------------------------------------------------
  # TypeScript SDK → npm package "figuard"
  # -------------------------------------------------------------------------
  sdk-typescript:
    name: Publish figuard (TypeScript SDK)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # Stamp the version from the tag — no manual bump PR needed.
      - name: Set version from tag
        working-directory: sdk/typescript
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Publishing version $VERSION"

      - name: Install dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Build
        run: npm run build
        working-directory: sdk/typescript

      - name: Publish to npm
        run: npm publish --access public
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # figuard-mcp is versioned + published independently — see publish-mcp.yml
  # (triggered by `mcp-v*` tags). Core `v*` tags never publish the MCP, so a
  # core release can't ship a stale MCP built against the previous SDK.

name: Publish npm packages

on:
  push:
    tags:
      - "v*"

jobs:
  # -------------------------------------------------------------------------
  # TypeScript SDK → npm package "figuard"
  # -------------------------------------------------------------------------
  sdk-typescript:
    name: Publish figuard (TypeScript SDK)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # Stamp the version from the tag — no manual bump PR needed.
      - name: Set version from tag
        working-directory: sdk/typescript
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version
          echo "Publishing version $VERSION"

      - name: Install dependencies
        run: npm ci
        working-directory: sdk/typescript

      - name: Build
        run: npm run build
        working-directory: sdk/typescript

      - name: Publish to npm
        run: npm publish --access public
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # -------------------------------------------------------------------------
  # MCP server → npm package "figuard-mcp"
  # MCP is versioned independently — it only publishes if the tag version
  # is newer than what's already on npm. No PR needed either.
  # -------------------------------------------------------------------------
  mcp:
    name: Publish figuard-mcp
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json

      # For MCP, compare the tag version against whatever is already published.
      # If the same version is already on npm, skip — avoids failures when
      # tagging a core release that didn't change the MCP.
      - name: Check whether this version is already published
        id: check
        working-directory: packages/mcp
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version &>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️ $NAME@$VERSION already on npm — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            npm version "$VERSION" --no-git-tag-version
            echo "✓ Will publish $NAME@$VERSION"
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: npm ci
        working-directory: packages/mcp

      - name: Build
        if: steps.check.outputs.skip == 'false'
        run: npm run build
        working-directory: packages/mcp

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

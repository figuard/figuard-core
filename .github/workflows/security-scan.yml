name: Security scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly — catches newly-disclosed CVEs in unchanged dependencies
    - cron: "0 6 * * 1"

jobs:
  trivy-fs:
    name: Trivy filesystem scan (dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy vulnerability scan (repo dependencies)
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy image scan (published container)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push) for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: figuard-scan:latest
          cache-from: type=gha

      - name: Trivy vulnerability scan (container image)
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          scan-type: image
          image-ref: figuard-scan:latest
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

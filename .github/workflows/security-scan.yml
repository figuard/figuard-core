name: Security scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly — catches newly-disclosed CVEs in unchanged dependencies
    - cron: "0 6 * * 1"

jobs:
  trivy-fs:
    name: Trivy filesystem scan (dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Install Trivy directly — avoids the trivy-action composite's transitive
      # setup-trivy dependency, which has broken on tag mismatches.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan repository dependencies
        run: |
          # --offline-scan: don't resolve Java deps from Maven Central (gets 429-rate-limited
          # on CI). Lockfile-based ecosystems (npm/pip) are still scanned; the image scan
          # below covers the full Java dependency tree from the built jar.
          trivy fs \
            --offline-scan \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-fs.sarif \
            .

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy image scan (published container)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push) for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: figuard-scan:latest
          cache-from: type=gha

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Scan container image
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --format sarif \
            --output trivy-image.sarif \
            figuard-scan:latest

      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

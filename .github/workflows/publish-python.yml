name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish figuard to PyPI
    runs-on: ubuntu-latest

    # Required for PyPI trusted publishing (OIDC) — no token needed
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stamp the version from the tag directly into __init__.py so no
      # manual version-bump PR is needed before tagging. The file on
      # main stays as a "last published" marker; the tag is the source
      # of truth for what actually gets published.
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" sdk/python/figuard/__init__.py
          echo "Publishing version $VERSION"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        working-directory: sdk/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

  publish-langchain:
    name: Build and publish figuard-langchain to PyPI
    runs-on: ubuntu-latest

    # Required for PyPI trusted publishing (OIDC) — no token needed
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Stamp the tag version into the standalone package's static version field.
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" sdk/figuard-langchain/pyproject.toml
          echo "Publishing figuard-langchain version $VERSION"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        working-directory: sdk/figuard-langchain
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/figuard-langchain/dist/

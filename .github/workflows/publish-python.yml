name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    name: Build and publish figuard to PyPI
    runs-on: ubuntu-latest

    # Required for PyPI trusted publishing (OIDC) — no token needed
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Verify the tag version matches what's in pyproject.toml / __init__.py
      # Prevents publishing a stale version if the version bump was forgotten.
      - name: Verify version matches tag
        working-directory: sdk/python
        run: |
          TAG="${GITHUB_REF_NAME#v}"   # strip leading 'v' from tag
          PKG=$(python -c "import figuard; print(figuard.__version__)")
          if [ "$TAG" != "$PKG" ]; then
            echo "❌ Tag version ($TAG) does not match package version ($PKG)."
            echo "   Bump the version in sdk/python/figuard/__init__.py before tagging."
            exit 1
          fi
          echo "✓ Version $PKG matches tag $TAG"
        env:
          PYTHONPATH: .

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        working-directory: sdk/python
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist/

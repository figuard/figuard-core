name: Rebuild sandbox

# Rebuilds the hosted sandbox on Render with a clean Docker layer cache.
#
# Triggers:
#   - workflow_dispatch: manual trigger from GitHub Actions UI (any time)
#   - release published: automatically on every tagged stable release
#
# NOT triggered on every push to main — after OSS release there will be many
# commits that should not automatically update the live sandbox.
#
# Required secret (add once in figuard-core repo settings → Secrets → Actions):
#   RENDER_SANDBOX_DEPLOY_HOOK_URL — Render deploy hook URL with clearCache=clear appended

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  rebuild-sandbox:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render sandbox rebuild (clear Docker layer cache)
        run: |
          curl -f -X POST "${{ secrets.RENDER_SANDBOX_DEPLOY_HOOK_URL }}"

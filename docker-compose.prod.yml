services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: figuard
      POSTGRES_USER: ${DB_USERNAME:-figuard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-figuard}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  figuard:
    image: ghcr.io/figuard/figuard-core:latest
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/figuard
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-figuard}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:?Set WEBHOOK_SECRET_KEY — generate with: openssl rand -base64 32}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:

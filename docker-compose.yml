services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: figuard
      POSTGRES_USER: figuard
      POSTGRES_PASSWORD: figuard_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U figuard"]
      interval: 5s
      timeout: 5s
      retries: 5

  figuard:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/figuard
      SPRING_DATASOURCE_USERNAME: figuard
      SPRING_DATASOURCE_PASSWORD: figuard_local
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FiGuard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-16.svg" sizes="16x16" />
    <link rel="icon" type="image/svg+xml" href="/favicon-32.svg" sizes="32x32" />
  </head>
  <body>
    <div id="root"></div>
    <script>window.global = window.globalThis;</script>
    <script>
      // Auto-configure on first visit so the dashboard works immediately.
      // In dev (Vite proxy) the URL stays blank — requests go to /api which
      // Vite forwards to localhost:8080. The demo key is pre-seeded in the
      // container so no manual setup is required.
      if (!localStorage.getItem('fg_api_key')) {
        localStorage.setItem('fg_api_url', '');
        localStorage.setItem('fg_api_key', 'ab_live_demo');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

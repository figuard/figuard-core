<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FiGuard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-16.svg" sizes="16x16" />
    <link rel="icon" type="image/svg+xml" href="/favicon-32.svg" sizes="32x32" />
  </head>
  <body>
    <div id="root"></div>
    <script>window.global = window.globalThis;</script>
    <script>
      // Auto-configure sandbox demo key on first visit so the dashboard
      // works immediately without requiring manual Settings configuration.
      if (!localStorage.getItem('fg_api_key')) {
        localStorage.setItem('fg_api_url', '');
        localStorage.setItem('fg_api_key', 'sb_live_demo');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

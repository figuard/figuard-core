<svg width="160" height="40" viewBox="0 0 160 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mark      { fill: #0A5C38; }
    .mark-fade { fill: #0A5C38; opacity: 0.45; }
    .fi        { fill: #0A5C38; }
    .guard     { fill: #1a1a18; }

    @media (prefers-color-scheme: dark) {
      .mark      { fill: #4ade80; }
      .mark-fade { fill: #4ade80; opacity: 0.45; }
      .fi        { fill: #4ade80; }
      .guard     { fill: #e2e8f0; }
    }
  </style>

  <!-- Mark -->
  <rect class="mark-fade" x="2"  y="18" width="5"  height="4"/>
  <rect class="mark"      x="8"  y="9"  width="3"  height="22"/>
  <rect class="mark"      x="8"  y="9"  width="7"  height="3"/>
  <rect class="mark"      x="8"  y="28" width="7"  height="3"/>
  <rect class="mark"      x="15" y="18" width="10" height="4"/>
  <rect class="mark"      x="29" y="9"  width="3"  height="22"/>
  <rect class="mark"      x="25" y="9"  width="7"  height="3"/>
  <rect class="mark"      x="25" y="28" width="7"  height="3"/>
  <rect class="mark-fade" x="33" y="18" width="5"  height="4"/>

  <!-- Wordmark -->
  <text class="fi"    x="46" y="29" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22" letter-spacing="-0.5">Fi</text>
  <text class="guard" x="70" y="29" font-family="Georgia, 'Times New Roman', serif" font-weight="400" font-size="22" letter-spacing="-0.4">Guard</text>
</svg>

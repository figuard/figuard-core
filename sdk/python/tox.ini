# tox — multi-Python test runner for the FiGuard Python SDK
#
# Usage:
#   tox                         # run all unit envs (py39–py312)
#   tox -e py311-unit           # single Python version
#   tox -e live                 # live tests (requires figuard:latest Docker image)
#   tox -e typecheck            # mypy
#
# Prerequisites for the live env:
#   docker build -t figuard:latest /path/to/figuard-core
#
# Python version management (local):
#   pyenv install 3.9.18 3.10.13 3.11.8 3.12.2
#   pyenv local 3.9.18 3.10.13 3.11.8 3.12.2

[tox]
envlist =
    py{39,310,311,312}-unit
    live
    typecheck
isolated_build = true

# ---------------------------------------------------------------------------
# Unit tests — mocked HTTP, no server required, fast
# ---------------------------------------------------------------------------

[testenv:py{39,310,311,312}-unit]
description = Unit and integration tests (mocked HTTP, no server required)
extras = dev
commands =
    pytest tests/ --ignore=tests/live -v {posargs}

# ---------------------------------------------------------------------------
# Live tests — spins up a real figuard stack via Testcontainers
# ---------------------------------------------------------------------------

[testenv:live]
description = Live tests against a real figuard server (Testcontainers)
basepython = python3.11
extras = dev,all
deps =
    testcontainers[compose]>=4.0
setenv =
    FIGUARD_USE_TESTCONTAINERS = true
commands =
    pytest tests/live/ -v {posargs}

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------

[testenv:typecheck]
description = mypy static type check
basepython = python3.11
extras = dev
commands =
    mypy figuard/ --ignore-missing-imports
